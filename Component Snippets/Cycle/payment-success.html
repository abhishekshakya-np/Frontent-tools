<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Cycle</title>
    <link href="css/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="page-container">
        <header class="header">
            <div class="logo-container">
                <img src="image/cycle_logo.png" alt="Cycle Logo">
            </div>
        </header>

        <main class="main-content">
            <div class="success-card">
                <div class="success-icon-wrapper">
                    <div class="success-icon">
                        <svg viewBox="0 0 512 512" width="80" height="80">
                            <circle cx="256" cy="256" r="256" fill="#10b981" opacity="0.1"/>
                            <path d="M504 256c0 136.967-111.033 248-248 248S8 392.967 8 256 119.033 8 256 8s248 111.033 248 248zM227.314 387.314l184-184c6.248-6.248 6.248-16.379 0-22.627l-22.627-22.627c-6.248-6.249-16.379-6.249-22.628 0L216 308.118l-70.059-70.059c-6.248-6.248-16.379-6.248-22.628 0l-22.627 22.627c-6.248 6.248-6.248 16.379 0 22.627l104 104c6.249 6.249 16.379 6.249 22.628.001z" fill="#10b981"/>
                        </svg>
                        <div class="checkmark-animation"></div>
                    </div>
                </div>

                <div class="success-content">
                    <h1 class="success-title">Payment Successful!</h1>
                    <p class="success-message">Your transaction has been completed successfully. Thank you for your purchase!</p>
                    
                    <div class="success-details">
                        <div class="detail-item">
                            <span class="detail-label">Transaction ID</span>
                            <span class="detail-value">#CY-2024-001234</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Amount</span>
                            <span class="detail-value">$299.00</span>
                        </div>
                    </div>

                    <div class="button-group">
                        <button class="btn btn-primary" onclick="window.location.href='#'">Back to Home</button>
                        <button class="btn btn-secondary" onclick="window.print()">Download Receipt</button>
                    </div>
                </div>

                <div class="bg-bubbles">
                    <li></li>
                    <li></li>
                    <li></li>
                    <li></li>
                    <li></li>
                    <li></li>
                    <li></li>
                    <li></li>
                    <li></li>
                    <li></li>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
