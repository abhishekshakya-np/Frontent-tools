<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Snippets - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="dashboard-header">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h4 class="mb-0">
                        <i class="fas fa-layer-group text-primary me-2"></i>
                        Manage Snippets
                    </h4>
                </div>
                <div class="col-md-6 text-end">
                    <a href="dashboard.html" class="btn btn-outline-secondary btn-sm me-2">
                        <i class="fas fa-arrow-left me-1"></i>Back
                    </a>
                    <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                        <i class="fas fa-sign-out-alt me-1"></i>Logout
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <nav class="nav flex-column">
                    <a class="nav-link" href="dashboard.html">
                        <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                    </a>
                    <a class="nav-link" href="manage-projects.html">
                        <i class="fas fa-folder me-2"></i>Projects
                    </a>
                    <a class="nav-link" href="manage-websites.html">
                        <i class="fas fa-globe me-2"></i>Websites
                    </a>
                    <a class="nav-link active" href="manage-snippets.html">
                        <i class="fas fa-code me-2"></i>Snippets
                    </a>
                </nav>
            </div>

            <div class="col-md-10 main-content">
                <div class="table-card">
                    <div class="table-header">
                        <h5 class="mb-0">Snippets List</h5>
                        <button class="btn btn-info" onclick="showCreateModal()">
                            <i class="fas fa-plus me-2"></i>Add New Snippet
                        </button>
                    </div>

                    <div id="loading" class="loading">
                        <div class="spinner-border text-info" role="status"></div>
                        <p class="mt-2">Loading snippets...</p>
                    </div>

                    <div id="snippetsTable" class="table-responsive" style="display: none;">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Category</th>
                                    <th>Badge</th>
                                    <th>URL</th>
                                    <th>Order</th>
                                    <th>Visible</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="snippetsTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div class="modal fade" id="snippetModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add New Snippet</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="snippetForm">
                        <input type="hidden" id="snippetId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Title *</label>
                                <input type="text" class="form-control" id="title" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Badge</label>
                                <input type="text" class="form-control" id="badge" placeholder="Component">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description *</label>
                            <textarea class="form-control" id="description" rows="3" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">URL *</label>
                                <input type="text" class="form-control" id="url" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Thumbnail</label>
                                <input type="text" class="form-control" id="thumbnail" placeholder="thumbnails/image.svg">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Icon Class</label>
                                <input type="text" class="form-control" id="icon" placeholder="fas fa-code">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category</label>
                                <input type="text" class="form-control" id="category" placeholder="ui-components">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Gradient</label>
                            <input type="text" class="form-control" id="gradient" placeholder="linear-gradient(135deg, #667eea 0%, #764ba2 100%)">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tags (comma separated)</label>
                            <input type="text" class="form-control" id="tags" placeholder="Navigation, Component">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Order</label>
                                <input type="number" class="form-control" id="order" value="1">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Visible</label>
                                <select class="form-select" id="visible">
                                    <option value="true">Yes</option>
                                    <option value="false">No</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-info" onclick="saveSnippet()">Save Snippet</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/crud-snippets.js"></script>
</body>
</html>
