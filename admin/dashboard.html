<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Frontend Collection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <!-- Header -->
    <div class="dashboard-header">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h4 class="mb-0">
                        <i class="fas fa-layer-group text-primary me-2"></i>
                        Frontend Collection Admin
                    </h4>
                </div>
                <div class="col-md-6 text-end">
                    <span class="me-3">Welcome, <strong id="usernameDisplay"></strong></span>
                    <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                        <i class="fas fa-sign-out-alt me-1"></i>Logout
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <nav class="nav flex-column">
                    <a class="nav-link active" href="dashboard.html">
                        <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                    </a>
                    <a class="nav-link" href="manage-projects.html">
                        <i class="fas fa-folder me-2"></i>Projects
                    </a>
                    <a class="nav-link" href="manage-websites.html">
                        <i class="fas fa-globe me-2"></i>Websites
                    </a>
                    <a class="nav-link" href="manage-snippets.html">
                        <i class="fas fa-code me-2"></i>Snippets
                    </a>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <h2 class="mb-4">Dashboard</h2>

                <!-- Stats Cards -->
                <div class="row mb-4">
                    <div class="col-md-4 mb-3">
                        <div class="stats-card primary">
                            <div class="d-flex align-items-center">
                                <div class="icon me-3">
                                    <i class="fas fa-folder"></i>
                                </div>
                                <div>
                                    <h3 class="mb-0" id="projectsCount">0</h3>
                                    <p class="text-muted mb-0">Projects</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="stats-card success">
                            <div class="d-flex align-items-center">
                                <div class="icon me-3">
                                    <i class="fas fa-globe"></i>
                                </div>
                                <div>
                                    <h3 class="mb-0" id="websitesCount">0</h3>
                                    <p class="text-muted mb-0">Websites</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="stats-card info">
                            <div class="d-flex align-items-center">
                                <div class="icon me-3">
                                    <i class="fas fa-code"></i>
                                </div>
                                <div>
                                    <h3 class="mb-0" id="snippetsCount">0</h3>
                                    <p class="text-muted mb-0">Snippets</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="row">
                    <div class="col-md-12">
                        <div class="table-card">
                            <h5 class="mb-3">Quick Actions</h5>
                            <div class="d-grid gap-2 d-md-flex">
                                <a href="manage-projects.html?action=create" class="btn btn-primary">
                                    <i class="fas fa-plus me-2"></i>Add New Project
                                </a>
                                <a href="manage-websites.html?action=create" class="btn btn-success">
                                    <i class="fas fa-plus me-2"></i>Add New Website
                                </a>
                                <a href="manage-snippets.html?action=create" class="btn btn-info">
                                    <i class="fas fa-plus me-2"></i>Add New Snippet
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
    <script>
        // Check authentication
        if (!checkAuth()) return;

        // Display username
        const username = localStorage.getItem('admin_username');
        document.getElementById('usernameDisplay').textContent = username || 'Admin';

        // Load stats
        async function loadStats() {
            try {
                const [projectsRes, websitesRes, snippetsRes] = await Promise.all([
                    fetch(`${API_BASE_URL}/projects`),
                    fetch(`${API_BASE_URL}/websites`),
                    fetch(`${API_BASE_URL}/snippets`)
                ]);

                const projects = await projectsRes.json();
                const websites = await websitesRes.json();
                const snippets = await snippetsRes.json();

                document.getElementById('projectsCount').textContent = projects.length;
                document.getElementById('websitesCount').textContent = websites.length;
                document.getElementById('snippetsCount').textContent = snippets.length;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        loadStats();
    </script>
</body>

</html>
