<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thumbnail Generator</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            padding: 20px;
            background: #f8f9fa;
        }

        .thumbnail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .thumbnail-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .thumbnail-preview {
            width: 100%;
            height: 200px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
            text-align: center;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
        }

        .thumbnail-info {
            text-align: center;
        }

        .download-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .download-btn:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>
    <h1>Project Thumbnail Generator</h1>
    <p>Generate placeholder thumbnails for all projects in the Frontend Collection</p>

    <button onclick="generateAllThumbnails()" class="download-btn">Generate All Thumbnails</button>

    <div class="thumbnail-grid" id="thumbnailGrid">
        <!-- Thumbnails will be generated here -->
    </div>

    <script>
        const projects = [
            { name: 'Digital Agency', filename: 'agency-thumb.jpg', color: '#667eea' },
            { name: 'Books Platform v4', filename: 'books4-thumb.jpg', color: '#f093fb' },
            { name: 'Books Platform v5', filename: 'books5-thumb.jpg', color: '#4facfe' },
            { name: 'Portfolio Landing', filename: 'bootstrap4master-thumb.jpg', color: '#43e97b' },
            { name: 'Nuno Theme Collection', filename: 'nuno-thumb.jpg', color: '#fa709a' },
            { name: 'Adventure Tours', filename: 'tours-thumb.jpg', color: '#38ef7d' },
            { name: 'The Rosa Restaurant', filename: 'rosa-thumb.jpg', color: '#fc466b' },
            { name: 'FAQ Accordion', filename: 'accordion-thumb.jpg', color: '#3f5efb' },
            { name: 'Modern Navigation', filename: 'navigation-thumb.jpg', color: '#fc4a1a' },
            { name: 'Admin Dashboard', filename: 'dashboard-thumb.jpg', color: '#4b6cb7' },
            { name: 'QR Code Component', filename: 'qrcode-thumb.jpg', color: '#667eea' },
            { name: 'AI Chatbot Assistant', filename: 'aichatbot-thumb.jpg', color: '#f093fb' },
            { name: 'Nova Business Template', filename: 'nova-thumb.jpg', color: '#4facfe' },
            { name: 'Wedding Template', filename: 'wedding-thumb.jpg', color: '#fa709a' },
            { name: 'Portfolio WebView', filename: 'webview-thumb.jpg', color: '#43e97b' },
            { name: 'CleverCow Business', filename: 'clevercow-thumb.jpg', color: '#38ef7d' },
            { name: 'CleverCow Bootstrap', filename: 'clevercowbootstrap-thumb.jpg', color: '#fc466b' },
            { name: 'CleverCow SCSS', filename: 'clevercowscss-thumb.jpg', color: '#3f5efb' },
            { name: "Mind's Mirror", filename: 'mindsmirror-thumb.jpg', color: '#fc4a1a' },
            { name: 'Magz Magazine', filename: 'magz-thumb.jpg', color: '#4b6cb7' },
            { name: 'Movie Search Website', filename: 'moviewebsite-thumb.jpg', color: '#667eea' },
            { name: 'CleverCow Production', filename: 'clevercowprod-thumb.jpg', color: '#f093fb' },
            { name: 'SKY - Sewa Ko Yatra', filename: 'skywebsite-thumb.jpg', color: '#4facfe' },
            { name: 'MrMarket NEPSE', filename: 'mrmarket-thumb.jpg', color: '#43e97b' },
            { name: 'Muktinath Krishi', filename: 'muktinath-thumb.jpg', color: '#38ef7d' }
        ];

        function generateThumbnail(project) {
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 250;
            const ctx = canvas.getContext('2d');

            // Create gradient background
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, project.color);
            gradient.addColorStop(1, adjustBrightness(project.color, -30));

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add subtle pattern
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            for (let i = 0; i < canvas.width; i += 20) {
                for (let j = 0; j < canvas.height; j += 20) {
                    if ((i + j) % 40 === 0) {
                        ctx.fillRect(i, j, 10, 10);
                    }
                }
            }

            // Add project name
            ctx.fillStyle = 'white';
            ctx.font = 'bold 24px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Add text shadow
            ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;

            ctx.fillText(project.name, canvas.width / 2, canvas.height / 2);

            // Add small logo/icon
            ctx.shadowColor = 'transparent';
            ctx.font = '48px FontAwesome';
            ctx.fillText('⚡', canvas.width / 2, canvas.height / 2 - 60);

            return canvas.toDataURL('image/jpeg', 0.9);
        }

        function adjustBrightness(hex, percent) {
            const num = parseInt(hex.replace("#", ""), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1);
        }

        function displayThumbnails() {
            const grid = document.getElementById('thumbnailGrid');
            grid.innerHTML = '';

            projects.forEach(project => {
                const card = document.createElement('div');
                card.className = 'thumbnail-card';

                const preview = document.createElement('div');
                preview.className = 'thumbnail-preview';
                preview.style.background = `linear-gradient(135deg, ${project.color}, ${adjustBrightness(project.color, -30)})`;
                preview.innerHTML = `<div>${project.name}</div>`;

                const info = document.createElement('div');
                info.className = 'thumbnail-info';
                info.innerHTML = `
                    <h4>${project.name}</h4>
                    <p>Filename: ${project.filename}</p>
                    <button class="download-btn" onclick="downloadThumbnail('${project.name}', '${project.filename}', '${project.color}')">
                        Download Thumbnail
                    </button>
                `;

                card.appendChild(preview);
                card.appendChild(info);
                grid.appendChild(card);
            });
        }

        function downloadThumbnail(name, filename, color) {
            const dataUrl = generateThumbnail({ name, filename, color });
            const link = document.createElement('a');
            link.download = filename;
            link.href = dataUrl;
            link.click();
        }

        function generateAllThumbnails() {
            projects.forEach(project => {
                setTimeout(() => {
                    downloadThumbnail(project.name, project.filename, project.color);
                }, projects.indexOf(project) * 100);
            });
        }

        // Initialize
        displayThumbnails();
    </script>
</body>

</html>
